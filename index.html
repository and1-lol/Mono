
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mono Market</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #10131b;
  color: #f4f5f8;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1050px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

#loading {
  color: #e9c46a;
  font-size: 13px;
}

.dashboard {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 16px;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel {
  background: #1c2230;
  border: 1px solid #30394b;
  border-radius: 13px;
  padding: 20px;
}

.top-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.label {
  color: #9ca8bb;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.value {
  font-size: 30px;
  font-weight: bold;
  margin-top: 9px;
}

.graph-panel {
  min-height: 390px;
}

.graph-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.change {
  font-size: 19px;
  font-weight: bold;
}

.positive { color: #20b77a; }
.negative { color: #df4c59; }
.neutral { color: #aab5c8; }

.range-buttons {
  display: flex;
  gap: 6px;
  margin-top: 15px;
}

.range {
  background: #30394b;
  color: #aab5c8;
  padding: 8px 12px;
  font-size: 12px;
}

.range.active {
  background: #20a879;
  color: white;
}

canvas {
  width: 100%;
  height: 260px;
  display: block;
  margin-top: 12px;
}

.graph-footer {
  display: flex;
  justify-content: space-between;
  color: #9ca8bb;
  font-size: 11px;
  margin-top: 8px;
}

.wager-panel {
  flex: 1;
}

input {
  width: 100%;
  padding: 13px;
  background: #10131b;
  border: 1px solid #46516a;
  color: white;
  border-radius: 8px;
  font-size: 17px;
  margin-top: 12px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.up { background: #20a879; }
.down { background: #df4c59; }

.reset {
  background: #39445b;
  width: 100%;
  margin-top: 12px;
}

.timer {
  font-size: 36px;
  font-weight: bold;
  text-align: center;
  margin-top: 12px;
}

.status {
  color: #aab5c8;
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 18px;
}

.balance-panel {
  margin-top: auto;
}

@media (max-width: 650px) {
  body { padding: 14px; }

  .dashboard {
    grid-template-columns: 1fr;
  }

  .graph-panel { min-height: 350px; }
  canvas { height: 220px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>MONO MARKET</h1>
  <div id="loading">Loading engine...</div>
</header>

<div class="dashboard">

  <!-- LEFT COLUMN -->
  <div class="column">

    <div class="top-stats">
      <div class="panel">
        <div class="label">FRC Value</div>
        <div class="value" id="price">---</div>
      </div>

      <div class="panel">
        <div class="label">Market Confidence</div>
        <div class="value" id="confidence">---</div>
      </div>
    </div>

    <div class="panel graph-panel">

      <div class="graph-header">
        <div class="label">Fork Coin</div>
        <div id="change" class="change neutral">--</div>
      </div>

      <div class="range-buttons">
        <button class="range" data-range="60">30 sec</button>
        <button class="range" data-range="600">5 min</button>
        <button class="range active" data-range="all">All time</button>
      </div>

      <canvas id="chart"></canvas>

      <div class="graph-footer">
        <span id="graph-start">Start</span>
        <span>Live price history</span>
        <span>Now</span>
      </div>

    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="column">

    <div class="panel wager-panel">
      <div class="label">Wager Zone</div>

      <div class="timer" id="timer">--</div>
      <div class="status" id="status">Loading market...</div>

      <input id="amount" type="number" min="1" step="1" value="10">

      <div class="buttons">
        <button class="up" id="up" disabled>UP ▲</button>
        <button class="down" id="down" disabled>DOWN ▼</button>
      </div>

      <button class="reset" id="reset" disabled>New Game</button>
    </div>

    <div class="panel balance-panel">
      <div class="label">Balance</div>
      <div class="value" id="balance">---</div>
    </div>

  </div>
</div>
</div>

<script>
let pyodide;

let marketTimer = null;
let roundActive = false;

let roundTicks = 0;
let startingPrice = 0;
let wagerAmount = 0;
let direction = "";

let lastPrice = 0;
let lastBalance = 0;
let lastConfidence = 50;

let history = [];
let graphRange = "all";

const $ = id => document.getElementById(id);


// DISPLAY

function display(data) {
  lastPrice = data.price;
  lastBalance = data.balance;
  lastConfidence = data.confidence;

  $("price").textContent = Number(data.price).toFixed(2);
  $("confidence").textContent = data.confidence + "%";
  $("balance").textContent = data.balance + " pts";
}


// BUTTON CONTROLS

function controls(enabled) {
  $("up").disabled = !enabled;
  $("down").disabled = !enabled;
  $("reset").disabled = !enabled;
}


// PERCENTAGE CHANGE

function updateChange() {
  const element = $("change");

  // Compare the current price with the price 60 ticks ago.
  if (history.length < 61) {
    element.textContent = "--";
    element.className = "change neutral";
    return;
  }

  const oldPrice = history[history.length - 61];
  const currentPrice = history[history.length - 1];

  if (oldPrice === 0) {
    element.textContent = "--";
    element.className = "change neutral";
    return;
  }

  const percentage = ((currentPrice - oldPrice) / oldPrice) * 100;

  const sign = percentage > 0 ? "+" : "";

  element.textContent = sign + percentage.toFixed(2) + "%";

  if (percentage > 0) {
    element.className = "change positive";
  } else if (percentage < 0) {
    element.className = "change negative";
  } else {
    element.className = "change neutral";
  }
}


// GRAPH RANGE

function setGraphRange(range) {
  graphRange = range;

  document.querySelectorAll(".range").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.range === String(range)
    );
  });

  drawGraph();
}


// GET VISIBLE HISTORY

function getVisibleHistory() {
  if (graphRange === "all") {
    return history;
  }

  return history.slice(-Number(graphRange));
}


// GRAPH

function drawGraph() {
  const canvas = $("chart");
  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const width = rect.width;
  const height = rect.height;

  ctx.clearRect(0, 0, width, height);

  const visible = getVisibleHistory();

  if (visible.length === 0) return;

  // Reserve room for the Y-axis labels.
  const left = 48;
  const right = width - 10;
  const top = 15;
  const bottom = height - 25;

  const graphWidth = right - left;
  const graphHeight = bottom - top;

  // Find minimum and maximum without spreading a huge array.
  let min = visible[0];
  let max = visible[0];

  for (const price of visible) {
    if (price < min) min = price;
    if (price > max) max = price;
  }

  // Give the graph some breathing room.
  let range = max - min;

  if (range < 1) range = 1;

  const padding = range * 0.12;

  min -= padding;
  max += padding;

  range = max - min;

  // Grid and Y-axis labels.
  ctx.font = "11px Arial";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  for (let i = 0; i <= 4; i++) {
    const fraction = i / 4;
    const y = bottom - fraction * graphHeight;
    const price = min + fraction * range;

    ctx.strokeStyle = "#3a465b";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();

    ctx.fillStyle = "#9ca8bb";
    ctx.fillText(price.toFixed(2), left - 7, y);
  }

  // Vertical axis.
  ctx.strokeStyle = "#46516a";
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, bottom);
  ctx.stroke();

  // Horizontal axis.
  ctx.beginPath();
  ctx.moveTo(left, bottom);
  ctx.lineTo(right, bottom);
  ctx.stroke();

  // Price line.
  if (visible.length > 1) {
    ctx.beginPath();

    visible.forEach((price, i) => {
      const x = left + (i / (visible.length - 1)) * graphWidth;
      const y = bottom - ((price - min) / range) * graphHeight;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    });

    ctx.strokeStyle = "#20b77a";
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    // Current price point.
    const lastY =
      bottom - ((visible[visible.length - 1] - min) / range) * graphHeight;

    ctx.beginPath();
    ctx.arc(right, lastY, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#20b77a";
    ctx.fill();
  }

  // X-axis labels.
  ctx.fillStyle = "#9ca8bb";
  ctx.font = "10px Arial";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText("Earlier", left, bottom + 8);

  ctx.textAlign = "right";
  ctx.fillText("Now", right, bottom + 8);
}


// ADD PRICE TO HISTORY

function addPrice(price) {
  history.push(price);

  updateChange();
  drawGraph();
}


// INITIALIZE / RESET

async function initializeGame() {
  const data = JSON.parse(
    await pyodide.runPythonAsync("ui_init()")
  );

  roundActive = false;
  roundTicks = 0;

  history = [];

  display(data);
  addPrice(data.price);

  $("timer").textContent = "--";
  $("status").textContent = "Market is live. Choose your direction.";
  $("amount").disabled = false;

  controls(true);
}


// CONTINUOUS MARKET LOOP

async function marketTick() {
  try {
    const data = JSON.parse(
      await pyodide.runPythonAsync("ui_tick()")
    );

    display(data);
    addPrice(data.price);

    // Only the wager timer depends on whether a wager is active.
    if (roundActive) {
      roundTicks--;

      $("timer").textContent =
        (roundTicks * 0.5).toFixed(1);

      if (roundTicks <= 0) {
        await finishRound();
      }
    }

  } catch (error) {
    console.error(error);

    if (roundActive) {
      roundActive = false;
      $("amount").disabled = false;
      controls(true);
    }

    $("status").textContent = "Error: " + error.message;

  } finally {
    // Schedule the next market update after this one finishes.
    marketTimer = setTimeout(marketTick, 500);
  }
}


// START A WAGER

async function startRound(choice) {
  if (roundActive) return;

  const amount = Number($("amount").value);

  if (!Number.isInteger(amount) || amount <= 0) {
    $("status").textContent =
      "Enter a valid whole-number wager.";
    return;
  }

  if (amount > lastBalance) {
    $("status").textContent = "Not enough points.";
    return;
  }

  roundActive = true;

  roundTicks = 30;
  direction = choice;
  wagerAmount = amount;

  // Record the price when the wager begins.
  startingPrice = lastPrice;

  controls(false);
  $("amount").disabled = true;

  $("timer").textContent = "15.0";

  $("status").textContent =
    "Wager placed: " + amount + " points.";
}


// SETTLE A WAGER

async function finishRound() {
  const result = JSON.parse(
    await pyodide.runPythonAsync(
      `ui_settle(${wagerAmount}, "${direction}", ${startingPrice})`
    )
  );

  display(result);

  roundActive = false;
  roundTicks = 0;

  $("timer").textContent = "0.0";
  $("amount").disabled = false;

  controls(true);

  if (result.result === "win") {
    $("status").textContent =
      "Won! +" + wagerAmount + " points.";

  } else if (result.result === "loss") {
    $("status").textContent =
      "Lost " + wagerAmount + " points.";

  } else {
    $("status").textContent = "Price unchanged. Tie!";
  }
}


// PYTHON ENGINE

async function boot() {
  try {
    pyodide = await loadPyodide();

    const response = await fetch("main.py");

    if (!response.ok) {
      throw new Error("Could not load main.py");
    }

    await pyodide.runPythonAsync(await response.text());

    // JavaScript-to-Python bridge.
    await pyodide.runPythonAsync(`

import json

def ui_init():
    global ui_balance, ui_price, ui_confidence

    ui_balance, ui_price = initialize()
    ui_confidence = 50

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence
    })


def ui_tick():
    global ui_price, ui_confidence

    # Price and confidence both update every market tick.
    ui_price, ui_confidence = movement(ui_price, ui_confidence)
    ui_confidence = confidence(ui_confidence)

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence
    })


def ui_settle(amount, direction, starting_price):
    global ui_balance, ui_price

    if direction == "up":
        won = ui_price > starting_price
        lost = ui_price < starting_price
    else:
        won = ui_price < starting_price
        lost = ui_price > starting_price

    if won:
        ui_balance += amount
        result = "win"

    elif lost:
        ui_balance -= amount
        result = "loss"

    else:
        result = "tie"

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence,
        "result": result
    })

`);

    $("loading").textContent = "ENGINE ONLINE";

    await initializeGame();

    // Start the market ONCE.
    if (marketTimer === null) {
      marketTick();
    }

  } catch (error) {
    $("loading").textContent = "Engine error";
    $("status").textContent = error.message;
    console.error(error);
  }
}


// BUTTON EVENTS

$("up").addEventListener("click", () => {
  startRound("up");
});

$("down").addEventListener("click", () => {
  startRound("down");
});

$("reset").addEventListener("click", async () => {
  if (!roundActive) {
    await initializeGame();
  }
});

// Graph range buttons.
document.querySelectorAll(".range").forEach(button => {
  button.addEventListener("click", () => {
    setGraphRange(button.dataset.range);
  });
});

window.addEventListener("resize", drawGraph);


// START

boot();

</script>
</body>
</html>
