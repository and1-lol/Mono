
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mono Market</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #10131b;
  color: #f4f5f8;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1050px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

#loading {
  color: #e9c46a;
  font-size: 13px;
}

.dashboard {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 16px;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel {
  background: #1c2230;
  border: 1px solid #30394b;
  border-radius: 13px;
  padding: 20px;
}

.top-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.label {
  color: #9ca8bb;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.value {
  font-size: 30px;
  font-weight: bold;
  margin-top: 9px;
}

.market-price {
  font-size: 38px;
  font-weight: bold;
  margin-top: 8px;
}

.graph-panel {
  min-height: 350px;
}

canvas {
  width: 100%;
  height: 260px;
  display: block;
  margin-top: 15px;
}

.wager-panel {
  flex: 1;
}

input {
  width: 100%;
  padding: 13px;
  background: #10131b;
  border: 1px solid #46516a;
  color: white;
  border-radius: 8px;
  font-size: 17px;
  margin-top: 12px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.up { background: #20a879; }
.down { background: #df4c59; }
.reset {
  background: #39445b;
  width: 100%;
  margin-top: 12px;
}

.timer {
  font-size: 36px;
  font-weight: bold;
  text-align: center;
  margin-top: 12px;
}

.status {
  color: #aab5c8;
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 18px;
}

.balance-panel {
  margin-top: auto;
}

@media (max-width: 650px) {
  body { padding: 14px; }

  .dashboard {
    grid-template-columns: 1fr;
  }

  .market-price { font-size: 31px; }
  .graph-panel { min-height: 300px; }
  canvas { height: 220px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>MONO MARKET</h1>
  <div id="loading">Loading engine...</div>
</header>

<div class="dashboard">

  <!-- LEFT COLUMN -->
  <div class="column">

    <div class="top-stats">
      <div class="panel">
        <div class="label">FRC Value</div>
        <div class="value" id="price">---</div>
      </div>

      <div class="panel">
        <div class="label">Market Confidence</div>
        <div class="value" id="confidence">---</div>
      </div>
    </div>

    <div class="panel graph-panel">
      <div class="label">Fork Coin</div>
      <canvas id="chart"></canvas>
      <div class="label">Live price history</div>
    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="column">

    <div class="panel wager-panel">
      <div class="label">Wager Zone</div>

      <div class="timer" id="timer">60</div>
      <div class="status" id="status">Choose your direction.</div>

      <input id="amount" type="number" min="1" step="1" value="10">

      <div class="buttons">
        <button class="up" id="up" disabled>UP ▲</button>
        <button class="down" id="down" disabled>DOWN ▼</button>
      </div>

      <button class="reset" id="reset" disabled>New Game</button>
    </div>

    <div class="panel balance-panel">
      <div class="label">Balance</div>
      <div class="value" id="balance">---</div>
    </div>

  </div>
</div>
</div>

<script>
let pyodide;
let running = false;
let interval;
let elapsed = 0;
let startingPrice = 0;
let wagerAmount = 0;
let direction = "";
let history = [];

const $ = id => document.getElementById(id);

function display(data) {
  $("price").textContent = Number(data.price).toFixed(2);
  $("confidence").textContent = data.confidence + "%";
  $("balance").textContent = data.balance + " pts";
}

function controls(enabled) {
  $("up").disabled = !enabled;
  $("down").disabled = !enabled;
  $("reset").disabled = !enabled;
}

function drawGraph() {
  const canvas = $("chart");
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const width = rect.width;
  const height = rect.height;

  ctx.clearRect(0, 0, width, height);

  if (history.length < 2) return;

  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = Math.max(max - min, 1);

  ctx.strokeStyle = "#3a465b";
  ctx.lineWidth = 1;

  for (let i = 0; i < 4; i++) {
    const y = i * height / 3;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }

  ctx.beginPath();

  history.forEach((price, i) => {
    const x = i / (history.length - 1) * width;
    const y = height - ((price - min) / range * (height - 24) + 12);

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.strokeStyle = "#20b77a";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.stroke();
}

function addPrice(price) {
  history.push(price);

  if (history.length > 100) history.shift();

  drawGraph();
}

async function initializeGame() {
  const data = JSON.parse(
    await pyodide.runPythonAsync("ui_init()")
  );

  history = [data.price];
  display(data);
  addPrice(data.price);

  $("timer").textContent = "60";
  $("status").textContent = "Choose your direction.";
  $("amount").disabled = false;

  controls(true);
}

async function startRound(choice) {
  if (running) return;

  const amount = Number($("amount").value);
  const balance = Number(
    $("balance").textContent.replace(" pts", "")
  );

  if (!Number.isInteger(amount) || amount <= 0) {
    $("status").textContent = "Enter a valid whole-number wager.";
    return;
  }

  if (amount > balance) {
    $("status").textContent = "Not enough points.";
    return;
  }

  running = true;
  elapsed = 0;
  direction = choice;
  wagerAmount = amount;
  startingPrice = Number($("price").textContent);

  controls(false);
  $("amount").disabled = true;

  $("status").textContent =
    "Wager placed: " + amount + " points.";

  interval = setInterval(async () => {
    elapsed++;

    try {
      const updateConfidence = elapsed % 10 === 0;

      const data = JSON.parse(
        await pyodide.runPythonAsync(
          `ui_tick(${updateConfidence ? "True" : "False"})`
        )
      );

      display(data);
      addPrice(data.price);

      $("timer").textContent = 60 - elapsed;

      if (elapsed >= 60) {
        clearInterval(interval);
        await finishRound();
      }
    } catch (error) {
      clearInterval(interval);
      running = false;
      controls(true);
      $("amount").disabled = false;
      $("status").textContent = "Error: " + error.message;
      console.error(error);
    }
  }, 1000);
}

async function finishRound() {
  const result = JSON.parse(
    await pyodide.runPythonAsync(
      `ui_settle(${wagerAmount}, "${direction}", ${startingPrice})`
    )
  );

  display(result);
  running = false;

  $("timer").textContent = "0";
  $("amount").disabled = false;
  controls(true);

  if (result.result === "win") {
    $("status").textContent = "Won! +" + wagerAmount + " points.";
  } else if (result.result === "loss") {
    $("status").textContent = "Lost " + wagerAmount + " points.";
  } else {
    $("status").textContent = "Price unchanged. Tie!";
  }
}

async function boot() {
  try {
    pyodide = await loadPyodide();

    const response = await fetch("main.py");
    if (!response.ok) throw new Error("Could not load main.py");

    await pyodide.runPythonAsync(await response.text());

    await pyodide.runPythonAsync(`
import json

def ui_init():
    global ui_balance, ui_price, ui_confidence
    ui_balance, ui_price = initialize()
    ui_confidence = 50

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence
    })

def ui_tick(update_confidence):
    global ui_price, ui_confidence

    ui_price = movement(ui_price, ui_confidence)

    if update_confidence:
        ui_confidence = confidence(ui_confidence)

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence
    })

def ui_settle(amount, direction, starting_price):
    global ui_balance, ui_price

    if direction == "up":
        won = ui_price > starting_price
        lost = ui_price < starting_price
    else:
        won = ui_price < starting_price
        lost = ui_price > starting_price

    if won:
        ui_balance += amount
        result = "win"
    elif lost:
        ui_balance -= amount
        result = "loss"
    else:
        result = "tie"

    return json.dumps({
        "balance": ui_balance,
        "price": ui_price,
        "confidence": ui_confidence,
        "result": result
    })
`);

    $("loading").textContent = "ENGINE ONLINE";
    await initializeGame();

  } catch (error) {
    $("loading").textContent = "Engine error";
    $("status").textContent = error.message;
    console.error(error);
  }
}

$("up").addEventListener("click", () => startRound("up"));
$("down").addEventListener("click", () => startRound("down"));

$("reset").addEventListener("click", async () => {
  if (!running) await initializeGame();
});

window.addEventListener("resize", drawGraph);

boot();
</script>
</body>
</html>
